  # ── Job Search Assistant (personal automation project) ────────────────────
  # Phase 2 and Phase 3 evidence updated June 2026.
  - id: proj_jsa
    name: "Job Search Assistant"
    type: PERSONAL
    date: "2026"
    discipline_tags: [software_automation, data_engineering]
    role: "Sole Developer"
    description: >
      End-to-end automated job-search pipeline built in Python: multi-source
      ingestion, deterministic scoring, LLM fit grading, resume and cover-letter
      generation, Drive upload, application tracking, and a human-reviewed
      employer intelligence repository.
    bullets:
      # ── Core pipeline ──────────────────────────────────────────────────────
      - text: >
          Built a multi-source job ingestion pipeline across 10+ ATS adapters
          (Greenhouse, Lever, Workday, USAJOBS, Adzuna, email alerts) with
          deduplication, repost detection, and a self-healing circuit breaker.
        discipline_tags: [software_automation, data_engineering]
        keywords: [Python, SQLite, automation, pipeline, data ingestion, API integration]

      # ── Phase 2: Signal scoring engine ────────────────────────────────────
      - text: >
          Designed a confidence-weighted signal scoring engine with 21 calibrated
          rules (11 benefit, 10 trajectory) using pre-compiled regex, one-hit-per-key
          deduplication, negative-pattern guards to eliminate false positives,
          and score normalization across the full rule weight distribution.
        discipline_tags: [software_automation]
        keywords: [Python, regex, scoring, signal extraction, data analysis]

      - text: >
          Implemented explainable scoring: each job's benefit and trajectory
          scores persist as structured JSON reason arrays in SQLite, enabling
          transparent score attribution and calibration — Phase 2.1 reduced
          false-positive rate by removing boilerplate career vocabulary matches.
        discipline_tags: [software_automation, data_engineering]
        keywords: [Python, SQLite, JSON, explainability, calibration]

      # ── Phase 3: Firm repository ───────────────────────────────────────────
      - text: >
          Built a human-reviewed employer intelligence repository with a complete
          lifecycle: automated discovery, skeleton draft generation, CLI review
          and approval workflow, YAML-to-SQLite synchronization, and structural
          enforcement that prevents unapproved drafts from affecting scoring or
          ingestion.
        discipline_tags: [software_automation, data_engineering]
        keywords: [Python, YAML, SQLite, Pydantic, data governance, workflow automation]

      - text: >
          Integrated firm-prior scoring: approved employer benefit and career
          trajectory intelligence blends with job-description signals (70/30
          benefit, 65/35 trajectory) using Pydantic-validated controlled
          vocabulary and confidence-weighted priors.
        discipline_tags: [software_automation]
        keywords: [Python, Pydantic, YAML, scoring integration, data quality]

      - text: >
          Enforced path-traversal-safe slug validation before any filesystem path
          construction; unapproved draft profiles are rejected at the Pydantic
          type boundary and cannot affect scoring regardless of data content.
        discipline_tags: [software_automation]
        keywords: [Python, Pydantic, security, validation, data governance]

      # ── Generation and testing ─────────────────────────────────────────────
      - text: >
          Implemented provider-agnostic LLM architecture supporting Anthropic
          Claude and OpenAI; generates tailored resumes and cover letters with
          deterministic DOCX rendering, keyword coverage tracking, and Drive
          upload with full generation audit trail.
        discipline_tags: [software_automation]
        keywords: [Python, LLM, OpenAI, Claude, automation, document generation]

      - text: >
          Maintained 500+ automated tests across 30 test files covering scoring,
          generation, firm repository, evidence selection, ingestion, and
          database migrations; all tests pass on main branch.
        discipline_tags: [software_automation]
        keywords: [Python, pytest, testing, quality assurance, automation]

    software_used: [Python, SQLite, Pydantic, YAML, OpenAI, Claude]

    jsa_evidence_summary:
      phase_2_scoring:
        - SignalRule / SignalHit / SignalScore frozen dataclass architecture
        - 11 benefit rules + 10 trajectory rules, calibrated weights
        - pre-compiled regex with negative-pattern guards
        - confidence-weighted score normalization clamped [0.0, 1.0]
        - benefit_reasons / trajectory_reasons JSON persistence
