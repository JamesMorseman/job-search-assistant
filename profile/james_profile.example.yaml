# ── Resume bullet bank ────────────────────────────────────────────────────────
# Reusable employer-facing bullets for the JSA project, organized by category.
# The expansion engine selects from software_data_automation when generating
# documents for roles that match the Job Search Assistant project.
# Updated: Phase 2 and Phase 3 evidence synchronized June 2026.
resume_bullet_bank:
  software_data_automation:
    # ── Signal scoring engine (Phase 2) ───────────────────────────────────────
    - "Designed a confidence-weighted job-scoring engine with 21 calibrated extraction rules, pre-compiled regex with negative-pattern guards to reduce false positives, and normalized scores across the full rule weight distribution"
    - "Built an explainable scoring system persisting structured reason arrays per job in SQLite, enabling transparent score attribution and calibration that reduced false-positive rate in Phase 2.1"
    - "Engineered a frozen-dataclass signal architecture (SignalRule / SignalHit / SignalScore) enforcing immutability and preventing accidental state mutation across the scoring pipeline"
    # ── Firm repository (Phase 3) ─────────────────────────────────────────────
    - "Built a human-reviewed employer intelligence repository with a five-stage lifecycle (discover → draft → review → approve → reject), YAML config-as-code, and idempotent YAML-to-SQLite synchronization"
    - "Implemented path-traversal-safe slug validation before any filesystem path construction, enforcing security constraints at the service boundary"
    - "Designed draft isolation enforced structurally at the type boundary — unapproved employer profiles are rejected by Pydantic model construction and cannot affect scoring or ingestion regardless of data content"
    - "Integrated employer intelligence into job scoring: approved benefit and trajectory priors blend with job-description signals using confidence-weighted coefficients and status multipliers"
    # ── Pipeline and infrastructure (Phase 1 / cross-phase) ──────────────────
    - "Built a multi-source job ingestion pipeline across 10+ ATS adapters with deduplication, repost detection, and a self-healing circuit breaker"
    - "Implemented provider-agnostic LLM architecture supporting multiple inference providers; generates tailored resumes and cover letters with deterministic DOCX rendering, keyword coverage tracking, and Drive upload"
    - "Maintained 500+ automated tests across 30 test files covering scoring, generation, firm repository, evidence selection, ingestion, and database migrations"

# ── Cover letter fragment bank ────────────────────────────────────────────────
# Reusable paragraph fragments and evidence claims for cover letter generation.
# Use these as the source pool when the JSA project is included in a cover letter.
# Updated: Phase 2 and Phase 3 evidence synchronized June 2026.
cover_letter_fragment_bank:
  signal_scoring:
    - >
      I designed and calibrated a confidence-weighted signal scoring engine that
      extracts benefit and career-trajectory signals from job descriptions using
      21 rules, pre-compiled regex, and negative-pattern guards — achieving
      transparent, explainable scores that persist structured reason arrays
      per job for audit and calibration.

  firm_intelligence:
    - >
      I built a human-reviewed employer intelligence repository that covers the
      complete firm lifecycle: automated discovery, skeleton draft generation,
      CLI review and approval, and idempotent YAML-to-SQLite synchronization.
      Approved employer benefit and trajectory priors blend into scoring using
      confidence-weighted coefficients, enriching job rankings with curated
      institutional knowledge.

  governance_architecture:
    - >
      I enforced data governance constraints structurally rather than by
      convention: unapproved employer profiles are rejected at the Pydantic
      type boundary and can never affect scoring or ingestion regardless of
      how they are stored. This design eliminates a class of silent correctness
      failures that rely on procedural compliance rather than type safety.

  human_reviewed_data_quality:
    - >
      I designed the system around a human-in-the-loop data quality model:
      automated discovery surfaces candidate employer profiles; a human reviews,
      edits, and approves each one before it enters the scoring pipeline. This
      ensures that employer intelligence driving job rankings reflects verified,
      intentional data rather than unchecked automation output.
